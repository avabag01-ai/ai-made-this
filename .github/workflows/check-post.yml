name: check-post
# Format / spam / proof checks. Runs on pull_request (forks get a read-only token, no secrets).
# The checker always comes from the base branch (a PR cannot edit its own judge); the PR is checked out only as data, nothing in it is executed.
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.author_association != 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: judge
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pr
      - name: check
        working-directory: pr
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ../judge/scripts/check_post.py --pr
